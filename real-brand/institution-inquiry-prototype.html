<!doctype html><html lang="ko"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="robots" content="noindex,nofollow"><title>REAL AROMA 기관 교육 신청 · 시제품</title>
<style>*{box-sizing:border-box}body{margin:0;background:#faf7f0;color:#24352a;font-family:system-ui,"Noto Sans KR",sans-serif}header{background:#4f6349;color:white;padding:27px 5vw}main{max-width:790px;margin:auto;padding:24px 17px}.panel{background:white;padding:25px;border:1px solid #dce3da;border-radius:14px}label{display:block;font-weight:650;margin:14px 0 6px}input,select,textarea{font:inherit;width:100%;border:1px solid #b7c8b5;border-radius:8px;padding:10px}textarea{min-height:90px}.two{display:grid;grid-template-columns:1fr 1fr;gap:14px}.hint{font-size:13px;color:#5d6c61;line-height:1.6}.notice{background:#fff1d8;border-radius:9px;padding:14px;line-height:1.6}button{background:#4f6349;color:white;border:0;padding:12px 18px;border-radius:8px;cursor:pointer;font:inherit}input[type=checkbox]{width:auto}.check{display:flex;gap:9px;align-items:flex-start}.check label{margin:0}@media(max-width:600px){.two{grid-template-columns:1fr}.panel{padding:16px}}</style></head><body>
<header><h1>REAL AROMA · 기관 출강 문의</h1><p>교육 프로그램 상담을 위한 신청 정보 작성</p></header><main><div class="notice"><strong>현재는 임시 문의 화면입니다.</strong> 온라인 신청 데이터베이스가 연결되지 않았습니다. 제출 버튼은 메일 프로그램을 열 뿐, 자동 발송하거나 사이트에 저장하지 않습니다.</div>
<section class="panel"><h2>기관 맞춤형 교육 문의</h2><form id="request">
<label for="org">기관명 *</label><input id="org" required maxlength="120" placeholder="예: ○○복지관">
<div class="two"><div><label for="contact">담당자명 *</label><input id="contact" required maxlength="50"></div><div><label for="email">담당자 이메일 *</label><input id="email" type="email" required maxlength="254"></div></div>
<label for="category">희망 교육 분야 *</label><select id="category" required><option value="">교육 분야 선택</option><option>아로마 기초·전문교육</option><option>감정·심리·컬러 아로마</option><option>웰니스 명상·싱잉볼</option><option>생활형 아로마 DIY</option><option>시니어 아로마·건강교육</option><option>스마트폰·AI 교육</option><option>기관 맞춤형 기타 교육</option></select>
<div class="two"><div><label for="date">희망 날짜</label><input id="date" type="date"></div><div><label for="count">예상 인원</label><input id="count" type="number" min="1" max="100000"></div></div>
<label for="location">희망 교육 지역/장소</label><input id="location" maxlength="150" placeholder="예: 경남 창원">
<label for="details">교육 목적 및 요청사항</label><textarea id="details" maxlength="2000"></textarea>
<div class="check" style="margin:18px 0"><input id="consent" type="checkbox" required><label for="consent">제공한 기관·담당자·연락처·교육 희망 정보를 출강 문의 응대 목적으로 이메일에 포함해 전달하는 데 동의합니다. 실제 운영 전 상세 개인정보 처리방침 및 보유기간을 고지해야 합니다.</label></div>
<button type="submit">메일 프로그램에서 문의 내용 확인</button><p class="hint">버튼을 누르면 본인의 기본 이메일 앱이 열립니다. 내용을 확인한 뒤 발송 버튼을 직접 눌러야 합니다. 메일 앱이 설치되지 않은 경우 전송되지 않을 수 있습니다.</p>
</form></section></main>
<script>(function(){'use strict';const get=id=>document.getElementById(id).value.trim();document.getElementById('request').addEventListener('submit',e=>{e.preventDefault();if(!e.target.reportValidity())return;const subject='[REAL AROMA 기관출강 문의] '+get('org');const fields=[['기관',get('org')],['담당자',get('contact')],['이메일',get('email')],['교육분야',get('category')],['희망날짜',get('date')||'협의'],['인원',get('count')||'미정'],['지역/장소',get('location')||'미정'],['상담내용',get('details')||'없음']];const body=fields.map(([k,v])=>k+': '+v).join('\n');location.href='mailto:gidal99@naver.com?subject='+encodeURIComponent(subject)+'&body='+encodeURIComponent(body)})})();</script></body></html>
